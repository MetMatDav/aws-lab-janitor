name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
        env:
          HYPOTHESIS_PROFILE: ci
      - name: CDK synth (cdk-nag, strict)
        # cdk.json runs "python3 app.py": setup-python's python3, which has the pip installs.
        run: npx cdk synth --strict --quiet -c reportEmail=ci@example.com
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1
      - name: cfn-lint
        # "--" ends --ignore-checks, which takes several values and would
        # otherwise swallow the template path and make cfn-lint read stdin.
        run: cfn-lint --ignore-checks W3005 -- cdk.out/*.template.json
